<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="LofiCave — 24/7 ad-free lofi stations. Pick a room and start listening.">
    <title>LofiCave • lofi stations 🎧</title>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- animated night-sky background (canvas, no video, no ads) -->
    <canvas id="bg" aria-hidden="true"></canvas>
    <!-- optional per-room looping gif (gifs/<station-id>.gif). falls back to canvas -->
    <img id="room-gif" alt="" aria-hidden="true">
    <!-- lofi.cafe layer stack: crt scanlines -> darken -> vignette -->
    <div id="crt-lines" aria-hidden="true"></div>
    <div id="darken" aria-hidden="true"></div>
    <div id="vignette"></div>

    <!-- direct ad-free audio stream (no YouTube, no pre-roll ads) -->
    <audio id="audio" preload="none"></audio>

    <!-- top bar -->
    <header id="topbar">
        <div id="logo">loficave 🎧</div>
        <button id="stations-btn" aria-label="choose station">stations</button>
    </header>

    <!-- station picker -->
    <nav id="station-picker" class="hidden" aria-label="stations"></nav>

    <!-- bottom control bar: terminal phosphor style, like lofi.cafe -->
    <footer id="hud">
        <div id="transport">
            <button id="play-btn" aria-label="play or pause">❚❚</button>
            <button id="prev-btn" aria-label="previous station">|◀</button>
            <button id="next-btn" aria-label="next station">▶|</button>
            <div id="vol-segs" role="slider" aria-label="volume" aria-valuemin="0" aria-valuemax="10" tabindex="0"></div>
        </div>
        <div id="nowline">
            <span id="eq" aria-hidden="true">▂▄▆</span>
            <button id="change-link">click to change &gt;</button>
            <span id="chan-box">[<span id="channel-name"><span class="idle">loading…</span></span>]</span>
        </div>
    </footer>

    <div id="keys-hint">space play/pause • ←/→ stations • m mute</div>

    <script src="script.js"></script>
</body>
</html>
